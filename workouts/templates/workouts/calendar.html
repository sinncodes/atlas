{% load static %}
<link rel="stylesheet" href="{% static 'workouts/calendar.css' %}">
<style>
table, th, td { border: 1px solid black; }
td.today { background: gold; font-weight: bold; }
</style>
<html>
<body>



<h2 style="text-align:center">{{ month_name }} {{ year }}</h2>

<table style="width:100%">
  <tr>
    <th>Monday</th><th>Tuesday</th><th>Wednesday</th>
    <th>Thursday</th><th>Friday</th><th>Saturday</th><th>Sunday</th>
  </tr>

  {% for week in weeks %}
  <tr>
    {% for day in week %}
      {% if day == 0 %}
        <td></td>
      {% elif day == today_day %}
        <td class="today">{{ day }}</td>
      {% else %}
        <td>{{ day }}</td>
      {% endif %}
    {% endfor %}
  </tr>
  {% endfor %}
</table>

</body>
</html>
