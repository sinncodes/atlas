{% load static %}
<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="{% static 'workouts/calendar.css' %}">
</head>
<body>

<h2 style="text-align:center">{{ month_name }} {{ year }}</h2>

<table style="width:80%">
  <tr>
    <th>Monday</th><th>Tuesday</th><th>Wednesday</th>
    <th>Thursday</th><th>Friday</th><th>Saturday</th><th>Sunday</th>
  </tr>

  {% for week in weeks %}
  <tr>
    {% for day in week %}
      {% if day == 0 %}
        <td></td>
      {% elif day == today_day %}
        <td class="today">{{ day }}</td>
      {% else %}
        <td>{{ day }}</td>
      {% endif %}
    {% endfor %}
  </tr>
  {% endfor %}
</table>

</body>
</html>
